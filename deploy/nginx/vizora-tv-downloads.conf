# ============================================================================
# Vizora — customer APK install surface (/tv + /downloads/)
#
# SOURCE OF TRUTH. Production nginx is host-installed at
# /etc/nginx/sites-enabled/vizora and is NOT generated from this repo, so this
# file must be copied there deliberately. scripts/release/publish-display-apk.sh
# does that and diffs it first.
#
# Install: paste the two location groups below into the `server { ... }` block
# that already terminates TLS for vizora.cloud, then:
#     nginx -t && systemctl reload nginx
#
# Block placement inside the server block does not matter. nginx resolves
# locations by specificity (exact `=` first, then regex, then longest prefix),
# not by file order — the "must be last" comment on `location /` in the live
# config is a misconception, harmless but untrue.
#
# ---------------------------------------------------------------------------
# WHY EVERY add_header IS REPEATED BELOW — do not "clean this up"
#
# nginx inherits add_header directives from the parent block ONLY IF the child
# block declares none of its own. Declaring even one add_header in a location
# silently DISCARDS every server-level add_header for that location.
#
# The live server block sets Strict-Transport-Security and Permissions-Policy.
# Both would vanish from the APK download the moment we add Content-Disposition
# here. This is not theoretical: the existing `location /uploads/` already
# declares `add_header Cache-Control "public"` and consequently returns no
# Permissions-Policy at all, plus an HSTS header that is actually NestJS
# Helmet's (max-age=31536000) leaking through the proxy rather than nginx's
# own max-age=63072000 preload value.
#
# If you change the server-level headers, change them here too.
# ---------------------------------------------------------------------------

# --- /tv : the customer-facing installer page ------------------------------
# Served as a static file, NOT as a Next.js route. A Next route would force a
# full web rebuild to change one line of version text, and that build has OOM'd
# this 3.7GB VPS before. A static file is a copy with no rebuild.
location = /tv {
    alias /var/www/vizora/tv/index.html;
    default_type text/html;

    # The page states the current version and hash, so it must never be
    # served stale. no-cache means "revalidate", not "do not store" —
    # nginx still answers 304 when the file is unchanged.
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Tolerate what TV on-screen keyboards actually produce: /tv/, /TV, /Tv/.
# Not a redirect loop — exact `=` matches are resolved before regex locations,
# so a request for /tv is answered above and never reaches this block.
# Never combine `alias` with a regex location; nginx requires captures there.
# The target below must stay a bare URL. A Markdown-style link would be a
# literal syntax error in nginx.
location ~* ^/tv/?$ {
    return 301 https://vizora.cloud/tv;
}

# --- /downloads/ : the APK itself ------------------------------------------
location /downloads/ {
    alias /var/www/vizora/downloads/;
    autoindex off;

    # Ubuntu's /etc/nginx/mime.types has NO apk entry (verified on this host),
    # so without this the APK is served as application/octet-stream and some
    # TV browsers refuse to hand it to the package installer.
    #
    # CAUTION: a `types` block REPLACES the inherited map, it does not extend
    # it. Every extension served from this directory must be listed here.
    # txt is present so a published SHA256SUMS file renders in-browser.
    types {
        application/vnd.android.package-archive apk;
        text/plain                              txt;
    }
    default_type application/octet-stream;

    add_header Content-Disposition "attachment" always;

    # vizora-display.apk is a MUTABLE filename — the bytes change under a fixed
    # URL on every release. Positive caching is exactly wrong here: a max-age
    # would let TVs and intermediaries serve the previous build with no way to
    # force a refresh. Revalidation on a 1.2MB file is free.
    add_header Cache-Control "no-cache" always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# NOTE ON THE ARCHIVE: superseded builds live in /var/www/vizora/archive/,
# a SIBLING of the served directory, never a child of it. Keeping them under
# /downloads/ would make every old build publicly fetchable by direct URL
# (autoindex off hides the listing, it does not restrict access).
