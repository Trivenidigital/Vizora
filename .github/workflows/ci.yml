name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  # Required environment variables for tests
  NODE_ENV: test
  JWT_SECRET: test-jwt-secret-at-least-32-characters-long
  DEVICE_JWT_SECRET: test-device-jwt-secret-that-is-32-chars
  DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
  MONGODB_URL: mongodb://localhost:27017/test_db
  REDIS_URL: redis://localhost:6379
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: test-bucket
  NEXT_PUBLIC_API_URL: http://localhost:3000
  NEXT_PUBLIC_SOCKET_URL: http://localhost:3002
  BACKEND_URL: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Generate Prisma client for tests
      - name: Generate Prisma client
        run: |
          pnpm --filter @vizora/database exec prisma generate
          mkdir -p packages/database/dist/generated
          cp -r packages/database/src/generated/* packages/database/dist/generated/

      # Build @vizora/database so consumers can resolve `import { PrismaClient } from '@vizora/database'`
      - name: Build @vizora/database
        run: npx nx build @vizora/database

      # Push schema to test database
      - name: Setup test database
        run: pnpm --filter @vizora/database exec prisma db push --skip-generate

      - name: Run middleware unit tests
        working-directory: middleware
        run: pnpm test --passWithNoTests

      - name: Run realtime unit tests
        working-directory: realtime
        run: pnpm test --passWithNoTests

      - name: Run web unit tests
        working-directory: web
        run: pnpm test --runInBand

      - name: Run display unit tests
        working-directory: display
        run: pnpm test:ci

      - name: Typecheck display client
        working-directory: display
        run: pnpm typecheck

      # `pnpm test:ops` runs under tsx, which STRIPS types without checking them,
      # and neither `lint` (middleware/src + realtime/src) nor the display
      # typecheck covers scripts/. So a type error in the code PM2 runs against
      # production could reach main silently — one already did. Runs after the
      # @vizora/database build above, which the middleware validator that
      # scripts/ops imports needs in order to resolve.
      - name: Typecheck ops scripts
        run: pnpm typecheck:ops

      # scripts/release is the APK publish gate and is EXCLUDED from typecheck:ops
      # (that config checks *.ts only; the gate's two executables are .mjs). It gets
      # its own config, which adds allowJs + checkJs for the release surface alone —
      # global checkJs would drag in ~17 unrelated one-off .js/.mjs helpers.
      - name: Typecheck release scripts
        run: pnpm typecheck:release

      - name: Run ops unit tests
        run: pnpm test:ops

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: middleware/coverage
          fail_ci_if_error: false

  # Apply the hand-written migration SQL against an EMPTY database, exactly as
  # `prisma migrate deploy` does on prod. The test/e2e jobs seed via
  # `prisma db push` (schema-direct), which NEVER executes migrations/*.sql — so
  # a broken migration (e.g. the #227 wrong-table-name) passed CI green and only
  # detonated on the prod deploy. This job closes that gap.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: migrate_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/migrate_db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Neutralize CONCURRENTLY for the clean CI replay (committed files untouched)
        run: |
          # `CREATE INDEX CONCURRENTLY` cannot run inside migrate deploy's transaction
          # (Postgres 25001 / Prisma P3018). On an EMPTY CI database the CONCURRENTLY
          # lock-avoidance is irrelevant to correctness, so strip it in the ephemeral CI
          # checkout only — the committed migration files (and their prod checksums) stay
          # byte-identical. This lets `migrate deploy` replay the full history and still
          # catch bad migration SQL (wrong table/column names — the #227 class).
          # NOTE: a true disaster-recovery `migrate deploy` from empty still needs these
          # CONCURRENTLY migrations handled manually; tracked as a follow-up.
          find packages/database/prisma/migrations -name migration.sql \
            -exec sed -i 's/INDEX CONCURRENTLY/INDEX/g' {} +

      - name: Apply all migrations from empty (fails on bad migration SQL)
        run: pnpm --filter @vizora/database exec prisma migrate deploy

      - name: Assert migration state is clean (all applied, none pending/failed)
        run: pnpm --filter @vizora/database exec prisma migrate status

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          pnpm --filter @vizora/database exec prisma generate
          mkdir -p packages/database/dist/generated
          cp -r packages/database/src/generated/* packages/database/dist/generated/

      - name: Build @vizora/database
        run: npx nx build @vizora/database

      - name: Setup test database
        run: pnpm --filter @vizora/database exec prisma db push --skip-generate

      # Only a narrow middleware E2E set is gated in CI right now.
      # The other middleware e2e specs (content/displays/playlists/auth/rate-limit)
      # have pre-existing failures that predate this pipeline — they never ran
      # in CI before (the old `middleware-e2e` Nx project didn't exist), so they
      # drifted. The customer-critical-path suite is intentionally included so
      # CI proves register -> pair -> content -> playlist -> schedule -> device
      # active-schedule delivery through the production /api/v1 route shape.
      # display-repair is gated because some of what it proves is provable
      # nowhere else. Its rollback test fails the LAST write of the rebind
      # transaction from inside Postgres (a temporary BEFORE INSERT trigger on
      # the audit table) and then asserts the display write is gone. The unit
      # fake can only MODEL a rollback, and its `tx` and `db` handles append to
      # the same array, so "the audit row cannot outlive a rolled-back rebind"
      # has no other enforcement. Ungated, that is not a gate.
      - name: Run middleware E2E tests (gated suites)
        run: pnpm --filter @vizora/middleware exec jest --config=jest.e2e.config.js --runInBand --testPathPattern="(agents|customer-critical-path|tenant-guard|b12-multi-tenant-revocation|display-repair)"

      # Realtime e2e (device-gateway.e2e-spec.ts) has a known pre-existing
       # failure in CI — it requires Prisma generate state + a MongoDB service
       # that the old Nx-based pipeline used to set up but no longer exists.
       # Tracked separately; non-blocking until the suite is rebuilt.
      - name: Run realtime E2E tests
        continue-on-error: true
        run: pnpm --filter @vizora/realtime test:e2e

  # Browser end-to-end suite. Added 2026-10-09.
  #
  # Until now NOTHING in CI ran Playwright: the `e2e` job above is a middleware
  # Jest subset plus a realtime suite marked continue-on-error. A regression that
  # broke two auth specs shipped through three green CI runs because of that gap.
  #
  # The stack is started exactly the way the suite was written and verified
  # against — `nx serve` for middleware and realtime, `next dev` for web. A
  # production web build is deliberately NOT used here: `next.config.security.js`
  # refuses a localhost origin for NEXT_PUBLIC_API_URL/SOCKET_URL when
  # NODE_ENV=production, and those are build-time inputs for the browser bundle,
  # so a prod build could not be pointed at the CI services at all.
  playwright:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      # Test-only secrets. They never leave the runner and gate nothing real;
      # the boot validators require >= 32 chars and JWT_SECRET != DEVICE_JWT_SECRET.
      JWT_SECRET: ci_playwright_jwt_secret_value_32chars_min
      DEVICE_JWT_SECRET: ci_playwright_device_secret_value_32chars_min
      MFA_ENCRYPTION_KEY: ci_playwright_mfa_encryption_key_32chars_min
      INTERNAL_API_SECRET: ci_playwright_internal_api_secret_value
      PORT: '3000'
      MIDDLEWARE_PORT: '3000'
      REALTIME_PORT: '3002'
      WEB_PORT: '3001'
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vizora
      MINIO_USE_SSL: 'false'
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3002
      BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_SCHEDULES_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # No MinIO here, deliberately. Two reasons, both checked rather than assumed:
      #   1. No spec in e2e-tests/ uploads a file — `setInputFiles` appears in
      #      none of them — so the browser suite never exercises object storage.
      #   2. StorageService fails OPEN outside production: it logs
      #      "MinIO connection failed ... falling back to local storage" and sets
      #      available=false. It throws only when NODE_ENV=production, and this
      #      job runs development.
      # Pulling it was also the first two failures of this job: anonymous
      # `docker pull minio/minio` from a runner is denied by Docker Hub, and the
      # same RELEASE tag on quay.io answers "unauthorized". If a spec ever needs
      # real uploads, add the container back with a registry that permits
      # anonymous pulls and re-check both points above.
      # The MINIO_* env above is left in place so the service still takes its
      # normal configuration path and the fallback is what gets exercised.

      - name: Generate Prisma client
        run: |
          pnpm --filter @vizora/database exec prisma generate
          mkdir -p packages/database/dist/generated
          cp -r packages/database/src/generated/* packages/database/dist/generated/

      - name: Build @vizora/database
        run: npx nx build @vizora/database

      - name: Push schema
        run: pnpm --filter @vizora/database exec prisma db push --skip-generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          npx nx serve @vizora/middleware > /tmp/middleware.log 2>&1 &
          npx nx serve @vizora/realtime  > /tmp/realtime.log  2>&1 &
          pnpm --filter @vizora/web dev > /tmp/web.log 2>&1 &

      # A port that accepts a connection is not a service that is ready, so each
      # wait polls the app's own endpoint rather than the socket.
      - name: Wait for the stack
        run: |
          wait_for () {
            local name="$1" url="$2"
            for i in $(seq 1 90); do
              if curl -sf -o /dev/null "$url"; then echo "$name ready"; return 0; fi
              sleep 2
            done
            echo "::error::$name never became ready at $url"
            return 1
          }
          wait_for middleware http://localhost:3000/api/v1/health || { tail -50 /tmp/middleware.log; exit 1; }
          wait_for realtime   http://localhost:3002/api/health    || { tail -50 /tmp/realtime.log;   exit 1; }
          wait_for web        http://localhost:3001/login         || { tail -50 /tmp/web.log;        exit 1; }

      - name: Run Playwright suite
        run: npx playwright test

      - name: Service logs on failure
        if: failure()
        run: |
          # `|| true` on each: this step is diagnostics. If the run failed before
          # the services were started the log files do not exist, and a failing
          # `tail` here would replace the real error with its own.
          echo '--- middleware ---'; tail -200 /tmp/middleware.log || true
          echo '--- realtime ---';   tail -200 /tmp/realtime.log   || true
          echo '--- web ---';        tail -200 /tmp/web.log        || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          pnpm --filter @vizora/database exec prisma generate
          mkdir -p packages/database/dist/generated
          cp -r packages/database/src/generated/* packages/database/dist/generated/

      - name: Build @vizora/database
        run: npx nx build @vizora/database

      - name: Build middleware
        run: npx nx build @vizora/middleware

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://vizora.cloud
          NEXT_PUBLIC_SOCKET_URL: https://vizora.cloud
          BACKEND_URL: https://vizora.cloud
        run: npx nx build @vizora/web

      # Provenance for the built client. Binds the artifact to the exact source
      # commit and records the public build inputs that were actually applied —
      # all non-secret by definition, since NEXT_PUBLIC_* values are embedded in
      # the browser bundle anyway.
      #
      # This exists because on 2026-08-12 an in-place `next build` on the prod
      # VPS was OOM-killed mid-compile and destroyed the live artifact, and there
      # was no retained build to restore from. It also gives B2c a machine-
      # readable record of what the deployed client was built from, instead of
      # reverse-engineering intended values out of minified chunks.
      # Provenance for EVERY NEXT_PUBLIC_* the app consumes, not just the ones
      # with values. The three listed as intentionally unset are read in the
      # browser, where an unset variable is `undefined` permanently — recording
      # them here is what makes "this artifact cannot do Google Sign-In"
      # readable from the artifact instead of inferred from its absence.
      # deploy/web-build-inputs.json is the source of truth; the mapping is
      # enforced by scripts/ops/web-build-inputs.test.ts.
      - name: Write web build metadata
        run: |
          cat > web/.next/build-metadata.env <<META
          sourceCommit=${{ github.sha }}
          sourceRef=${{ github.ref }}
          builtBy=github-actions
          runId=${{ github.run_id }}
          builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          nextVersion=$(cd web && node -p "require('next/package.json').version")
          NEXT_PUBLIC_API_URL=https://vizora.cloud
          NEXT_PUBLIC_SOCKET_URL=https://vizora.cloud
          BACKEND_URL=https://vizora.cloud
          buildInputsIntentionallyUnset=NEXT_PUBLIC_SENTRY_DSN,NEXT_PUBLIC_SCHEDULES_ENABLED,NEXT_PUBLIC_GOOGLE_CLIENT_ID
          META
          echo "--- build-metadata.env ---"
          cat web/.next/build-metadata.env

      # Refuse to RETAIN an artifact that would fail the deployment eligibility
      # check. Production validates again before any swap, but an artifact that
      # cannot be deployed should never occupy a retention slot or be mistaken
      # for a recovery candidate.
      - name: Validate web build artifact
        run: npx tsx scripts/ops/validate-web-artifact.ts web/.next

      # `next start` needs the whole .next tree, not just static/. `cache/` is
      # excluded: it is build-time only (tsbuildinfo, optimised images) and is
      # the bulk of the size.
      #
      # `include-hidden-files` is REQUIRED: `.next` is a dotfile directory and
      # upload-artifact@v4 excludes hidden paths by default. Without it the
      # upload silently finds nothing — which is exactly how the first run of
      # this workflow failed ("No files were found with the provided path").
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-next-${{ github.sha }}
          path: |
            web/.next
            !web/.next/cache
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Build realtime
        run: npx nx build @vizora/realtime

      - name: Build display client
        working-directory: display
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check for hardcoded JWTs
        run: pnpm security:no-hardcoded-jwts
      # Blocking gate on fixable high/critical advisories in production deps.
      # No --ignore-registry-errors here (unlike the scheduled security-audit.yml):
      # a PR gate should fail CLOSED on a registry error (transient red is re-runnable;
      # a silent pass is a hole). See docs/plans/2026-07-06-production-readiness-audit.md S1-3.
      - name: Security audit (production deps — blocks on fixable high/critical)
        run: pnpm audit --prod --audit-level=high --ignore-unfixable
